<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yaadain</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3eadb;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;

            height: 90vh;

            background: #fffaf2;

            border-radius: 20px;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .header {
            background: #1f4b4a;

            color: white;

            padding: 20px;

            text-align: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .header p {
            font-size: 12px;

            opacity: 0.8;

            margin-top: 5px;
        }

        .messages {
            flex: 1;

            padding: 20px;

            overflow-y: auto;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .message {
            max-width: 75%;

            padding: 10px 14px;

            border-radius: 15px;

            font-size: 15px;

            line-height: 1.4;

            word-wrap: break-word;

            position: relative;
        }

        .mine {
            align-self: flex-end;

            background: #1f4b4a;

            color: white;

            border-bottom-right-radius: 4px;
        }

        .theirs {
            align-self: flex-start;

            background: #eee8dc;

            color: #222;

            border-bottom-left-radius: 4px;
        }

        .sender-name {
            font-size: 10px;

            font-weight: bold;

            margin-bottom: 4px;

            opacity: 0.65;
        }

        .mine .sender-name {
            color: #dce9e6;
        }

        .theirs .sender-name {
            color: #1f4b4a;
        }

        .time {
            font-size: 10px;

            opacity: 0.6;

            margin-top: 4px;

            text-align: right;
        }

        .input-area {
            padding: 15px;

            display: flex;

            gap: 10px;

            border-top: 1px solid #ddd;

            background: #fffaf2;
        }

        #messageInput {
            flex: 1;

            border: 1px solid #ccc;

            border-radius: 25px;

            padding: 12px 16px;

            font-size: 15px;

            outline: none;
        }

        #messageInput:focus {
            border-color: #1f4b4a;
        }

        #sendButton {
            width: 45px;

            height: 45px;

            border: none;

            border-radius: 50%;

            background: #1f4b4a;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        #sendButton:hover {
            background: #173936;
        }

        #sendButton:active {
            transform: scale(0.95);
        }

        #sendButton:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        @media (max-width: 500px) {

            body {
                align-items: stretch;
            }

            .chat-container {
                height: 100vh;

                max-width: none;

                border-radius: 0;
            }

            .messages {
                padding: 15px;
            }
        }

    </style>

</head>

<body>

<div class="chat-container">

    <div class="header">

        <h1>YAADAIN</h1>

        <p>Our little space</p>

    </div>

    <div
        class="messages"
        id="messages"
    ></div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Write a message..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            type="button"
        >
            ➤
        </button>

    </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

/* IMPORTANT:
   ONLY plain URL here.
*/

const API = "https://yaadain.onrender.com";


/* =====================================================
   ELEMENTS
===================================================== */

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const messages =
    document.getElementById("messages");


/* =====================================================
   ROOM CODE
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const roomCode =
    urlParams.get("code");


/* =====================================================
   DEVICE ID
===================================================== */

let deviceId =
    localStorage.getItem(
        "yaadainDeviceId"
    );


if (!deviceId) {

    deviceId =
        "device_" +
        crypto.randomUUID();

    localStorage.setItem(
        "yaadainDeviceId",
        deviceId
    );
}


console.log(
    "Current Device ID:",
    deviceId
);


/* =====================================================
   USER NAME
===================================================== */

let myName = localStorage.getItem("yaadainName");

if (!myName) {
    myName = prompt("Enter your name:");

    if (!myName || !myName.trim()) {
        myName = "Guest";
    }

    myName = myName.trim();

    localStorage.setItem("yaadainName", myName);
}

console.log("Current Name:", myName);

/* =====================================================
   ROOM CHECK
===================================================== */

if (!roomCode) {

    alert("No room code found.");

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages() {

    if (!roomCode) {
        return;
    }

    try {

        const response =
            await fetch(
                `${API}/messages?code=${encodeURIComponent(roomCode)}`
            );


        if (!response.ok) {

            throw new Error(
                "Could not load messages"
            );

        }


        const data =
            await response.json();


        messages.innerHTML = "";


        data.forEach(
            message => {

                displayMessage(message);

            }
        );


        messages.scrollTop =
            messages.scrollHeight;

    }


    catch (error) {

        console.error(
            "Could not load messages:",
            error
        );

    }

}


/* =====================================================
   DISPLAY MESSAGE
===================================================== */

function displayMessage(message) {

    const messageBox =
        document.createElement("div");


    messageBox.classList.add(
        "message"
    );


    /*
       SAME DEVICE  -> RIGHT
       OTHER DEVICE -> LEFT
    */

    if (
        message.device_id &&
        message.device_id === deviceId
    ) {

        messageBox.classList.add(
            "mine"
        );

    }

    else {

        messageBox.classList.add(
            "theirs"
        );

    }


    /* SENDER NAME */

    const senderName =
        document.createElement("div");

    senderName.classList.add(
        "sender-name"
    );

    senderName.textContent =
        message.name || "Unknown";


    /* MESSAGE TEXT */

    const messageText =
        document.createElement("div");

    messageText.textContent =
        message.text;


    /* TIME */

    const time =
        document.createElement("div");

    time.classList.add(
        "time"
    );


    const date =
        new Date(
            message.timestamp
        );


    if (!isNaN(date.getTime())) {

        time.textContent =
            date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }

    else {

        time.textContent = "";

    }


    /* BUILD */

    messageBox.appendChild(
        senderName
    );

    messageBox.appendChild(
        messageText
    );

    messageBox.appendChild(
        time
    );


    messages.appendChild(
        messageBox
    );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (
        !text ||
        !roomCode
    ) {

        return;

    }


    sendButton.disabled = true;


    try {

        const response =
            await fetch(
                `${API}/messages`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            room_code:
                                roomCode,

                            name:
                                myName,

                            text:
                                text,

                            device_id:
                                deviceId

                        })
                }
            );


        const data =
            await response.json();


        console.log(
            "Send response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Message could not be sent"
            );

        }


        messageInput.value = "";


        await loadMessages();

    }


    catch (error) {

        console.error(
            "Send message error:",
            error
        );


        alert(
            "Message not sent: " +
            error.message
        );

    }


    finally {

        sendButton.disabled =
            false;

        messageInput.focus();

    }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadMessages();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadMessages,
    2000
);

</script>


</body>

</html>
